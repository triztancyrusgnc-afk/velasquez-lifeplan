<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E4A6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2634;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CCB877;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C8C60;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle arcs -->
  <path d="M 100 15 A 85 85 0 0 1 185 100" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 185 100 A 85 85 0 0 1 100 185" fill="none" stroke="url(#grayGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 100 185 A 85 85 0 0 1 15 100" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 15 100 A 85 85 0 0 1 100 15" fill="none" stroke="url(#grayGrad)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <!-- CSV Text -->
  <text x="100" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#1A2634" letter-spacing="-2">CSV</text>
  <!-- EST. 1990 -->
  <text x="100" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#6C8BAA" letter-spacing="3">EST. 1990</text>
</svg>
